services:
  db:
    image: postgres:16
    container_name: soul_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: soul_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: soul_web
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn soul.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  celery_worker:
    build: .
    container_name: soul_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A soul worker --loglevel=info --pool=solo
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media

  celery_beat:
    build: .
    container_name: soul_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    command: celery -A soul beat --loglevel=info
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data: